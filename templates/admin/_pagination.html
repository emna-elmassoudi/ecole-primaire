{% if pagination.pages > 1 %}
    <div class="admin-pagination">
        {% if pagination.has_prev %}
            <a href="{{ url_for(request.endpoint, page=pagination.prev_num) }}" class="btn btn-sm btn-outline"><i class="fas fa-chevron-left"></i></a>
        {% endif %}
        <span class="page-info">Page {{ pagination.page }} / {{ pagination.pages }} ({{ pagination.total }} éléments)</span>
        {% if pagination.has_next %}
            <a href="{{ url_for(request.endpoint, page=pagination.next_num) }}" class="btn btn-sm btn-outline"><i class="fas fa-chevron-right"></i></a>
        {% endif %}
    </div>
{% endif %}
