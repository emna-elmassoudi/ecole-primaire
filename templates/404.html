{% extends "base.html" %}
{% block title %}Page non trouvée - {{ site_name }}{% endblock %}

{% block content %}
<div class="page-section" style="text-align:center;padding:80px 0;">
    <i class="fas fa-map-signs" style="font-size:4rem;color:var(--orange);margin-bottom:20px;"></i>
    <h1 style="font-size:3rem;font-weight:900;color:var(--blue);">404</h1>
    <p style="font-size:1.2rem;color:var(--gray-400);margin:12px 0 24px;">Page non trouvée</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="fas fa-home"></i> Retour à l'accueil</a>
</div>
{% endblock %}
